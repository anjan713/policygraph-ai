services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: policygraph
      POSTGRES_USER: policygraph
      POSTGRES_PASSWORD: policygraph
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policygraph -d policygraph"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/policygraph-password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://policygraph:policygraph@postgres:5432/policygraph
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: policygraph-password
      USE_NEO4J: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      USE_GCS: ${USE_GCS:-false}
      GCS_BUCKET: ${GCS_BUCKET:-policygraph-dev-uploads}
      GCS_PREFIX: ${GCS_PREFIX:-policygraph/uploads}
      OCR_ENGINE: paddleocr
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-en}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-200}
    volumes:
      - ./backend/data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://policygraph:policygraph@postgres:5432/policygraph
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: policygraph-password
      USE_NEO4J: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      USE_GCS: ${USE_GCS:-false}
      GCS_BUCKET: ${GCS_BUCKET:-policygraph-dev-uploads}
      GCS_PREFIX: ${GCS_PREFIX:-policygraph/uploads}
      OCR_ENGINE: paddleocr
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-en}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-200}
    volumes:
      - ./backend/data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
